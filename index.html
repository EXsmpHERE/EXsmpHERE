<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX-AI V1.0 | EXsmpHERE İNDİR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #020617; --neon: #10b981; --panel: #0f172a; }
        body, html { background: var(--bg); margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* --- AÇILIŞ EKRANI --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease;
        }
        .splash-text {
            color: var(--neon); font-size: 5rem; font-weight: 900;
            letter-spacing: 15px; text-shadow: 0 0 20px var(--neon);
            animation: pulse 1.5s infinite alternate;
        }
        .loading-bar { width: 200px; height: 4px; background: #111; margin-top: 25px; border-radius: 10px; overflow: hidden; }
        .loading-progress { width: 0%; height: 100%; background: var(--neon); animation: load 2.5s forwards; }
        
        @keyframes pulse { from { opacity: 0.4; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes load { to { width: 100%; } }

        /* --- ANA BUTON EKRANI --- */
        #main {
            display: none; opacity: 0; transition: opacity 1s;
            flex-direction: column; align-items: center; text-align: center;
        }

        .title { font-size: 3rem; font-weight: 900; color: var(--neon); margin-bottom: 40px; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon); }

        .btn-indir {
            background: rgba(16, 185, 129, 0.1); 
            border: 3px solid var(--neon);
            padding: 30px 60px; 
            border-radius: 20px; 
            text-decoration: none;
            color: var(--neon); 
            font-weight: 900; 
            font-size: 2rem;
            display: flex; 
            align-items: center; 
            gap: 20px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4); 
            transition: 0.4s;
        }
        .btn-indir:hover { 
            background: var(--neon); 
            color: #000; 
            box-shadow: 0 0 70px var(--neon); 
            transform: scale(1.1); 
        }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-text">EX-AI</div>
    <div class="loading-bar"><div class="loading-progress"></div></div>
</div>

<div id="main">
    <div class="title">EX-AI V1.0</div>
    
    <a href="https://github.com/EXsmpHERE/EXsmpHERE/releases/download/v1.0/EX-AI.app_rar.rar" class="btn-indir">
        <i class="fas fa-download"></i>
        <span>EX-AI İNDİR</span>
    </a>
</div>

<script>
    // Sistem Akışı
    window.onload = () => {
        setTimeout(() => {
            const splash = document.getElementById('splash');
            const main = document.getElementById('main');
            
            splash.style.opacity = '0'; // Karart
            
            setTimeout(() => {
                splash.style.display = 'none'; // Siler
                main.style.display = 'flex'; // Butonu getir
                setTimeout(() => { main.style.opacity = '1'; }, 50);
            }, 800);
        }, 3000); // 3 saniye sonra açılış biter
    };
</script>

</body>
</html>
