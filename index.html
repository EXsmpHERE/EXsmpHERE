<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX-AI V1.0 | EXsmpHERE Network</title>
    <style>
        :root { --bg: #020617; --text: #10b981; --panel: #0f172a; --border: #1e293b; --msg-u: #059669; --msg-ai: #1e293b; --white: #f8fafc; }
        
        body, html { background: var(--bg); margin: 0; padding: 0; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* --- SPLASH SCREEN (AÇILIŞ EKRANI) --- */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.8s ease-in-out;
        }
        .splash-text {
            color: var(--text); font-size: 5rem; font-weight: bold;
            letter-spacing: 15px; text-shadow: 0 0 20px var(--text);
            animation: pulse 1.5s infinite alternate;
        }
        .loading-bar {
            width: 200px; height: 4px; background: #111; margin-top: 20px;
            border-radius: 10px; overflow: hidden;
        }
        .loading-progress {
            width: 0%; height: 100%; background: var(--text);
            animation: load 2s forwards;
        }
        @keyframes pulse { from { opacity: 0.5; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes load { to { width: 100%; } }

        /* --- ANA ARAYÜZ --- */
        #app { display: none; flex-direction: column; height: 100vh; opacity: 0; transition: opacity 0.5s; }
        .header { padding: 15px; background: var(--panel); border-bottom: 2px solid var(--text); text-align: center; font-weight: bold; font-size: 22px; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 12px 18px; border-radius: 15px; line-height: 1.5; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .u { align-self: flex-end; background: var(--msg-u); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: var(--msg-ai); color: var(--white); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
        
        .input-area { padding: 15px; background: var(--panel); display: flex; gap: 10px; border-top: 1px solid var(--border); }
        input { flex: 1; background: var(--bg); border: 1px solid var(--text); color: white; padding: 14px; border-radius: 10px; outline: none; }
        button { background: var(--text); color: #000; border: none; padding: 0 25px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-text">EX-AI</div>
    <div class="loading-bar"><div class="loading-progress"></div></div>
</div>

<div id="app">
    <div class="header">EX-AI V1.0</div>
    <div id="chat">
        <div class="msg ai">🤖 Sistem yüklendi. EXsmpHERE Network hizmetinizde. Ne yapalım kanks?</div>
    </div>
    <div class="input-area">
        <input type="text" id="soru" placeholder="Mesajınızı buraya bırakın..." autocomplete="off">
        <button id="btn" onclick="gonder()">GÖNDER</button>
    </div>
</div>

<script>
    // AÇILIŞ EKRANI KONTROLÜ
    window.onload = () => {
        setTimeout(() => {
            const splash = document.getElementById('splash');
            const app = document.getElementById('app');
            splash.style.opacity = '0'; // Yavaşça kaybol
            setTimeout(() => {
                splash.style.display = 'none';
                app.style.display = 'flex';
                setTimeout(() => { app.style.opacity = '1'; }, 50);
            }, 800);
        }, 2500); // 2.5 saniye sonra sistem açılır
    };

    let sohbetGecmisi = ""; 

    async function gonder() {
        const kutu = document.getElementById('soru');
        const btn = document.getElementById('btn');
        const chat = document.getElementById('chat');
        const mesaj = kutu.value.trim();
        if(!mesaj || btn.disabled) return;

        kutu.disabled = true; btn.disabled = true;
        chat.innerHTML += `<div class="msg u">${mesaj}</div>`;
        kutu.value = "";
        
        const aiDiv = document.createElement('div');
        aiDiv.className = "msg ai";
        aiDiv.innerText = "🤖 ...";
        chat.appendChild(aiDiv);
        chat.scrollTop = chat.scrollHeight;

        try {
            const response = await fetch('http://localhost:11434/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "gemma2:2b",
                    prompt: "Sen EXsmpHERE ağının zeki asistanısın. Kısa cevaplar ver.\n" + sohbetGecmisi + "\nKullanıcı: " + mesaj + "\nAsistan:",
                    stream: false
                })
            });
            const data = await response.json();
            aiDiv.innerText = "🤖 " + data.response.trim();
            sohbetGecmisi += `\nKullanıcı: ${mesaj}\nAsistan: ${data.response}`;
        } catch (hata) {
            aiDiv.innerText = "⚠️ Bağlantı hatası! .bat dosyasını çalıştırın.";
        } finally {
            kutu.disabled = false; btn.disabled = false;
            kutu.focus(); chat.scrollTop = chat.scrollHeight;
        }
    }

    document.getElementById('soru').onkeydown = (e) => { if(e.key === 'Enter') gonder(); };
</script>

</body>
</html>
