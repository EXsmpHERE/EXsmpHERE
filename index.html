<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>EX-AI V1.0 | EXsmpHERE Network</title>
    <style>
        :root { --bg: #020617; --text: #10b981; --panel: #0f172a; --border: #1e293b; --msg-u: #059669; --msg-ai: #1e293b; --white: #f8fafc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { padding: 15px; background: var(--panel); border-bottom: 2px solid var(--text); text-align: center; font-weight: bold; font-size: 20px; letter-spacing: 1px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 12px; line-height: 1.4; }
        .u { align-self: flex-end; background: var(--msg-u); color: white; }
        .ai { align-self: flex-start; background: var(--msg-ai); color: var(--white); border: 1px solid var(--border); }
        .input-area { padding: 20px; background: var(--panel); display: flex; gap: 10px; border-top: 1px solid var(--border); }
        input { flex: 1; background: var(--bg); border: 1px solid var(--text); color: white; padding: 12px; border-radius: 8px; outline: none; }
        button { background: var(--text); color: #000; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>

<div class="header">EX-AI V1.0</div>

<div id="chat">
    <div class="msg ai">Selam EX-AI V1.0 sistemine hoş geldin. Bellek aktif, seni dinliyorum. Ne yapalım?</div>
</div>

<div class="input-area">
    <input type="text" id="soru" placeholder="Mesaj yaz..." autocomplete="off">
    <button id="btn" onclick="gonder()">GÖNDER</button>
</div>

<script>
    // HAFIZA BURADA TUTULUYOR
    let sohbetGecmisi = ""; 

    async function gonder() {
        const kutu = document.getElementById('soru');
        const btn = document.getElementById('btn');
        const chat = document.getElementById('chat');
        const mesaj = kutu.value.trim();

        if(!mesaj) return;

        // Arayüzü Hazırla
        kutu.disabled = true;
        btn.disabled = true;
        chat.innerHTML += `<div class="msg u">${mesaj}</div>`;
        kutu.value = "";
        
        const aiDiv = document.createElement('div');
        aiDiv.className = "msg ai";
        aiDiv.innerText = "...";
        chat.appendChild(aiDiv);
        chat.scrollTop = chat.scrollHeight;

        // Hafızayı Ollama'nın anlayacağı formatta birleştiriyoruz
        const tamPrompt = sohbetGecmisi + "\nKullanıcı: " + mesaj + "\nAsistan:";

        try {
            const response = await fetch('http://localhost:11434/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "gemma2:2b",
                    prompt: "Sen zeki bir asistansın. Önceki konuşmaları hatırla ve kısa cevap ver.\n" + tamPrompt,
                    stream: false
                })
            });

            const data = await response.json();
            const cevap = data.response.trim();
            
            aiDiv.innerText = cevap;

            // HAFIZAYA EKLE (Bir sonraki mesajda hatırlaması için)
            sohbetGecmisi += `\nKullanıcı: ${mesaj}\nAsistan: ${cevap}`;

        } catch (hata) {
            aiDiv.innerText = "Bağlantı koptu!";
        } finally {
            kutu.disabled = false;
            btn.disabled = false;
            kutu.focus();
            chat.scrollTop = chat.scrollHeight;
        }
    }

    document.getElementById('soru').onkeydown = (e) => { if(e.key === 'Enter') gonder(); };
</script>

</body>
</html>
